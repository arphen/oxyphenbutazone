# Fast end-to-end signal: unit tests, the public-style build, then the smoke suite
# headless against it (system Chrome via CHROMIUM; the repo uses playwright-core,
# so no browser is downloaded by npm).
name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: browser-actions/setup-chrome@latest
        id: chrome
      - run: npm run e2e -- smoke
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
